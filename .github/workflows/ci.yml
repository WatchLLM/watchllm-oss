name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  webproof-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webproof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Rust toolchain
        # The organization's Actions policy only allows GitHub-owned, WatchLLM-owned,
        # Marketplace-verified actions, or pypa/gh-action-pypi-publish. GitHub's
        # Ubuntu runners ship rustup, so install the toolchain without a third-party
        # action; dtolnay/rust-toolchain is not on the allowlist and made every run
        # fail at startup.
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Validate native engine
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          cargo clippy --manifest-path engine/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path engine/Cargo.toml --locked
      - name: Install and test SDK
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -v
      - name: Build native wheel and source distribution
        run: |
          python -m build
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("watchllm_webproof/_native") for name in names), names
          PY

  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e . pytest build
      - name: Run tests
        run: python -m pytest -v
      - name: Build package
        run: python -m build

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type check and bundle
        run: |
          npx tsc --noEmit
          npm run bundle
      - name: Audit production dependencies
        # The extension has no runtime dependencies: every package in
        # package.json is a devDependency and esbuild bundles the extension.
        # Auditing dev-only tooling made this required check fail on advisories
        # in @vscode/vsce and friends without changing anything that ships.
        run: npm audit --omit=dev --audit-level=high
