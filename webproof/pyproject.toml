[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "watchllm-webproof"
version = "0.2.0"
description = "Public HTTP recording SDK with a Rust-backed deterministic local commitment engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "WatchLLM" }]
keywords = ["watchllm", "http", "provenance", "webproof"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-httpx>=0.30,<1",
  "responses>=0.25,<1",
]

[project.scripts]
watchllm = "watchllm_webproof.cli:main"

[tool.maturin]
manifest-path = "engine/Cargo.toml"
module-name = "watchllm_webproof._native"
python-source = "src"
features = ["python"]
strip = true

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
